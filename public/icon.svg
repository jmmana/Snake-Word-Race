<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2ebff" />
      <stop offset="100%" stop-color="#e5d8fb" />
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c52eb" />
      <stop offset="50%" stop-color="#63c5bd" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Serpentine Track -->
  <path d="M 120 380 Q 256 420 380 340 T 360 200 T 160 160 T 360 100" 
        fill="none" stroke="#334155" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <path d="M 120 380 Q 256 420 380 340 T 360 200 T 160 160 T 360 100" 
        fill="none" stroke="url(#snakeGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Snake Head / Crown / Finish -->
  <circle cx="360" cy="100" r="32" fill="#eab308" filter="url(#glow)" />
  <!-- Eye -->
  <circle cx="370" cy="94" r="6" fill="#e5d8fb" />
  <circle cx="372" cy="92" r="2" fill="#ffffff" />
  <!-- Word letter 'S' in center -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#glow)">S</text>
  <!-- Trophy / Star accent -->
  <polygon points="360,74 366,88 381,88 369,97 373,111 360,102 347,111 351,97 339,88 354,88" fill="#ffffff" />
</svg>
